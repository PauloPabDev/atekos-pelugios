services:
  # Puertos de BD remapeados: los estándar del host los usan otros proyectos.
  postgres:
    ports: ['${PG_PORT:-15432}:5432']
  mongo:
    ports: ['${MONGO_PORT:-27018}:27017']
  redis:
    ports: ['${REDIS_PORT:-16379}:6379']

  api:
    build:
      target: dev
    environment:
      NODE_ENV: development
      PUBLIC_URL: http://localhost:8080
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/drizzle:/repo/apps/api/drizzle
      - ./packages/shared/src:/repo/packages/shared/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./packages/shared/src:/repo/packages/shared/src

  proxy:
    build:
      target: proxy-dev
    ports: ['8080:80']
    depends_on:
      web: { condition: service_started }
